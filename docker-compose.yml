services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}        
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}          
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  airflow-init:
    image: apache/airflow:2.8.1
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    command: >
        bash -c "airflow db migrate &&
                 airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    depends_on:
        - postgres
    volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./airflow/logs:/opt/airflow/logs
        - ./airflow/plugins:/opt/airflow/plugins
        - ./dbt:/opt/dbt
        - ./src:/opt/airflow/src                        

  airflow-webserver:
    image: apache/airflow:2.8.1
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      FRED_API_KEY: ${FRED_API_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BONDS_DB: ${BONDS_DB}
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    command: webserver
    group_add:
      - "1001"
    volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./airflow/logs:/opt/airflow/logs
        - ./airflow/plugins:/opt/airflow/plugins
        - ./dbt:/opt/dbt
        - ./src:/opt/airflow/src
        - /var/run/docker.sock:/var/run/docker.sock

  airflow-scheduler:
    image: apache/airflow:2.8.1
    environment:
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
        FRED_API_KEY: ${FRED_API_KEY}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        BONDS_DB: ${BONDS_DB}
    depends_on:
      - postgres
    command: scheduler
    group_add:
      - "1001"
    volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./airflow/logs:/opt/airflow/logs
        - ./airflow/plugins:/opt/airflow/plugins
        - ./dbt:/opt/dbt
        - ./src:/opt/airflow/src
        - /var/run/docker.sock:/var/run/docker.sock

  dbt:
    image: python:3.11-slim
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./dbt:/opt/dbt
    working_dir: /opt/dbt
    entrypoint: ["bash", "-c", "apt-get update -q && apt-get install -y git -q && pip install dbt-core==1.8.2 dbt-postgres==1.8.2 -q && tail -f /dev/null"]
    depends_on:
      - postgres

volumes:
  postgres_data: